# Font Settings
font_family MesloLGS NF Regular
bold_font MesloLGS NF Bold
italic_font MesloLGS NF Italic
bold_italic_font MesloLGS NF Bold Italic
font_size 16.0

# A port of everforest by sainnhe
# https://github.com/sainnhe/everforest

background  #2D353B
foreground  #D3C6AA

cursor                #D3C6AA

selection_foreground  #7A8478
selection_background  #56635F

color0  #3c474d
color8  #868d80

# red
color1                #E67E83
# light red
color9                #E67E83

# green
color2                #a7c080
# light green
color10               #a7c080

# yellow
color3                #DBBC7F
# light yellow
color11               #DBBC7F

# blue
color4                #7FBBB3
# light blue
color12               #7FBBB3

# magenta
color5                #D699B6
# light magenta
color13               #D699B6

# cyan
color6                #83C092
# light cyan
color14               #83C092

# light gray
color7                #9DA9A0
# dark gray
color15               #7A8478

background_opacity 0.7
background_tint 0.2

# Scrollback config
scrollback_lines: 4000

# Tab bar styling
tab_bar_style powerline

shell .

editor .

macos_quit_when_last_window_closed yes

#kitty_mod super
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9

enable_audio_bell no
visual_bell_duration 0.2
